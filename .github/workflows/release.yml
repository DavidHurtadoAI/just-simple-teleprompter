name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches manifest
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          test "$GITHUB_REF_NAME" = "$VERSION"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
